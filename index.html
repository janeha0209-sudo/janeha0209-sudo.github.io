<script>
const D = window.SITE_DATA || {};
const R = D.research || [], T = D.teaching || [], P = D.press || [], S = D.site || [];
const esc = s => String(s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const arrow = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9L9 3M9 3H4M9 3v5"/></svg>';

/* ── 노션 '홈 콘텐츠' 접근 헬퍼 ── */
const by  = k => S.filter(r => r.kind === k && r.show !== false).sort((a,b) => (a.order||0)-(b.order||0));
const one = (k, key) => by(k).find(r => r.key === key) || {};
const t   = (r) => (lang === 'en' && r.en) ? r.en : (r.ko || '');

/* ── 실적 집계 ── */
const n = ty => R.filter(r => r.type === ty).length;
const N = { intl:n('국제학술지'), dom:n('국내학술지'), conf:n('국제학회')+n('국내학회'), award:n('수상'), book:n('저서') };
const recent  = R.filter(r => ['국제학술지','국내학술지'].includes(r.type)).slice(0, 3);
const awards  = R.filter(r => r.type === '수상');
const books   = R.filter(r => r.type === '저서');
const courses = [...new Set(T.filter(x => x.kind !== '특강').map(x => x.course))];

/* ── 언어 ── */
const L = {
  ko:{ intl:'국제 학술지', dom:'국내 학술지', conf:'학회 발표', award:'수상',
       hello:'안녕하세요. 하지은의 홈페이지입니다. 연구 · 강의 · 저서 · 언론 보도 · 문의 무엇이든 물어보시면 해당 내용이나 페이지를 찾아드릴게요.',
       ph:'예: 최근 논문이 뭔가요?',
       sugs:['최근 논문이 뭔가요?','강의 과목이 궁금해요','저서가 있나요?','문의하려면?'] },
  en:{ intl:'Intl. Journals', dom:'Domestic Journals', conf:'Presentations', award:'Awards',
       hello:'Welcome. Ask about research, teaching, books, press, or how to get in touch — I will point you to the right page.',
       ph:'e.g. What are your recent papers?',
       sugs:['What are your recent papers?','What do you teach?','Have you written books?','How do I contact you?'] }
};
let lang = 'ko';
try { lang = localStorage.getItem('lang') || 'ko'; } catch(e) {}

function paint() {
  const tr = L[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => el.innerHTML = el.dataset[lang]);
  document.getElementById('ko').setAttribute('aria-pressed', lang === 'ko');
  document.getElementById('en').setAttribute('aria-pressed', lang === 'en');
  document.getElementById('q').placeholder = tr.ph;

  /* 인트로 */
  document.getElementById('title-line').innerHTML = t(one('소개문','직함'));
  document.getElementById('thesis').innerHTML     = t(one('소개문','한 줄 소개'));
  document.getElementById('roles').innerHTML      = t(one('소개문','활동'));
  document.getElementById('teach-note').innerHTML   = t(one('소개문','강의 안내'));
  document.getElementById('contact-note').innerHTML = t(one('소개문','문의 안내'));

  /* 약력 */
  document.getElementById('bio').innerHTML = ['약력 1문단','약력 2문단','약력 3문단']
    .map(k => t(one('소개문', k))).filter(Boolean).map(p => `<p>${p}</p>`).join('');
  document.getElementById('interests').innerHTML = by('관심분야')
    .map(r => `<span class="tag">${t(r)}</span>`).join('');
  const cv = rows => rows.map(r => `<div class="r"><div class="yr">${esc(r.period)}</div>
      <div class="t">${esc(t(r))}${r.desc ? `<small>${esc(r.desc)}</small>` : ''}</div></div>`).join('');
  document.getElementById('edu').innerHTML    = cv(by('학력'));
  document.getElementById('career').innerHTML = cv(by('경력'));

  /* 연구 */
  document.getElementById('stats').innerHTML = [[tr.intl,N.intl],[tr.dom,N.dom],[tr.conf,N.conf],[tr.award,N.award]]
    .map(([l,v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  const card = r => `<article class="item"><div class="yr">${esc(r.year)}</div>
      <div><h3>${esc(r.title)}</h3><p>${esc(r.detail)}</p></div></article>`;
  document.getElementById('recent').innerHTML     = recent.map(card).join('');
  document.getElementById('award-list').innerHTML = awards.map(card).join('');

  /* Scholar 버튼 */
  const sch = by('Scholar')[0];
  document.getElementById('scholar-slot').innerHTML = (sch && sch.link)
    ? `<a class="btn" href="${esc(sch.link)}" target="_blank" rel="noopener">${esc(t(sch))} ${arrow}</a>` : '';

  /* 강의 */
  document.getElementById('courses').innerHTML = courses
    .map((c,i) => `<span class="tag">${i < 3 ? '<b>'+esc(c)+'</b>' : esc(c)}</span>`).join('');

  /* 진단 도구 — 노션에서 링크를 넣고 '게시'를 체크해야 나타납니다 */
  const tool = by('진단도구')[0];
  const sec = document.getElementById('tools');
  if (tool && tool.link) {
    sec.style.display = '';
    document.getElementById('tool-slot').innerHTML = `
      <a class="tool" href="${esc(tool.link)}" target="_blank" rel="noopener">
        <div><div class="kind">Generative AI Competency</div>
          <h3>${esc(tool.key)}</h3><p>${esc(t(tool))}</p></div>
        <span class="go">${lang === 'ko' ? '진단 시작하기' : 'Start assessment'} ${arrow}</span></a>`;
  } else { sec.style.display = 'none'; }

  /* 문의 링크 */
  document.getElementById('links').innerHTML = by('문의링크').map(r => {
    const mail = String(r.link).startsWith('mailto:');
    return `<a class="btn${mail ? ' solid' : ''}" href="${esc(r.link)}"${mail ? '' : ' target="_blank" rel="noopener"'}>${esc(t(r))}</a>`;
  }).join('');

  document.getElementById('stamp').textContent = D.updated ? 'LAST SYNC ' + D.updated : '';

  const s = document.getElementById('sugs'); s.innerHTML = '';
  tr.sugs.forEach(x => { const b = document.createElement('button'); b.className='sug'; b.textContent=x;
    b.addEventListener('click', () => { me(x); answer(x); }); s.appendChild(b); });
}
function setLang(v){ lang = v; try{ localStorage.setItem('lang', v); }catch(e){}
  document.getElementById('log').innerHTML=''; paint(); }
document.getElementById('ko').onclick = () => setLang('ko');
document.getElementById('en').onclick = () => setLang('en');

/* ═══════ 챗봇 ═══════ */
const ul = a => '<ul>' + a.map(x => `<li>${x}</li>`).join('') + '</ul>';

/* 데이터에서 자동으로 만들어지는 답변 */
const AUTO = [
  { k:["최근 논문","최신","논문","publication","paper"],
    a:()=>(lang==='ko'?'최근 발표한 논문입니다.':'Recent publications:')+ul(recent.map(r=>`<b>${esc(r.year)}</b> ${esc(r.title)}`)),
    link:()=>({t:lang==='ko'?'연구실적 전체 보기':'All publications',u:'publications.html'}) },
  { k:["학회","발표","conference","poster","aect","isls"],
    a:()=>lang==='ko' ? `AECT · ISLS · ICoME · IEEE 등에서 발표했고, 학회 발표는 총 <b>${N.conf}건</b>입니다.`
                      : `I have presented <b>${N.conf}</b> papers and posters at AECT, ISLS, ICoME, and IEEE.`,
    link:()=>({t:lang==='ko'?'학회 발표 목록':'Presentations',u:'publications.html#conf'}) },
  { k:["저서","책","출간","book","저자"],
    a:()=>(lang==='ko'?'두 권의 저서가 있습니다.':'I have written two books.')+ul(books.map(b=>`<b>${esc(b.year)}</b> ${esc(b.title)}`)),
    link:()=>({t:lang==='ko'?'저서 보기':'Books',u:'books.html'}) },
  { k:["강의","수업","과목","teaching","course","teach"],
    a:()=>(lang==='ko'?'제주관광대학교 창업마케팅학과에서 강의합니다.':'I teach at Jeju Tourism University:')+ul(courses.slice(0,4).map(esc)),
    link:()=>({t:lang==='ko'?'강의실적 보기':'Teaching records',u:'teaching.html'}) },
  { k:["수상","award","상"],
    a:()=>(lang==='ko'?'수상 내역입니다.':'Awards:')+ul(awards.map(r=>`<b>${esc(r.year)}</b> ${esc(r.title)} — ${esc(r.detail)}`)),
    link:()=>({t:lang==='ko'?'수상 보기':'Awards',u:'#awards'}) },
  { k:["언론","보도","방송","인터뷰","기사","press","media","kbs"],
    a:()=>(lang==='ko'?'방송·신문에 소개되었습니다.':'Featured in broadcast and print media:')+ul(P.slice(0,3).map(p=>`<b>${esc(p.year)}</b> ${esc(p.outlet)}`)),
    link:()=>({t:lang==='ko'?'언론 보도 보기':'Press',u:'press.html'}) },
  { k:["연락","문의","이메일","메일","contact","email","협업","공동연구","초청","강연"],
    a:()=>lang==='ko' ? '공동연구 · 초청 강연 · 척도 사용 문의를 환영합니다. 아래 Email 버튼을 눌러 메일을 보내주세요.'
                      : 'I welcome collaboration and invited talks. Use the Email button below.',
    link:()=>({t:lang==='ko'?'문의하기':'Contact',u:'#contact'}) }
];

/* 노션 '챗봇' 행에서 오는 답변 */
const FROM_NOTION = by('챗봇').map(r => ({
  k: String(r.key).split(',').map(x => x.trim()).filter(Boolean),
  a: () => t(r),
  link: () => (r.link ? { t: r.desc || (lang==='ko'?'자세히 보기':'More'), u: r.link } : null)
}));
const KB = AUTO.concat(FROM_NOTION);

const askBtn=document.getElementById('ask-btn'),ask=document.getElementById('ask'),
      log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send');
function openAsk(){ask.classList.add('open');askBtn.style.display='none';q.focus();
  if(!log.children.length)bot(L[lang].hello)}
function closeAsk(){ask.classList.remove('open');askBtn.style.display='flex'}
askBtn.onclick=openAsk;document.getElementById('ask-x').onclick=closeAsk;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ask.classList.contains('open'))closeAsk()});
function me(x){const d=document.createElement('div');d.className='msg me';d.textContent=x;log.appendChild(d);log.scrollTop=log.scrollHeight}
function bot(html,link){const d=document.createElement('div');d.className='msg bot';d.innerHTML=html;
  if(link&&link.u){const a=document.createElement('a');a.className='jump';a.href=link.u;a.textContent=link.t+' →';
    if(String(link.u).startsWith('http')){a.target='_blank';a.rel='noopener'}
    else if(String(link.u).charAt(0)==='#'){a.addEventListener('click',closeAsk)}
    d.appendChild(a)}
  log.appendChild(d);log.scrollTop=log.scrollHeight}
function typing(){const d=document.createElement('div');d.className='msg bot';
  d.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function match(text){const x=text.toLowerCase();let best=null,sc=0;
  KB.forEach(e=>{let s=0;e.k.forEach(k=>{if(k&&x.indexOf(k.toLowerCase())>-1)s+=k.length});if(s>sc){sc=s;best=e}});
  return sc>0?best:null}
function answer(text){
  const wait=typing();
  setTimeout(()=>{wait.remove();const hit=match(text);
    if(hit) bot(hit.a(), hit.link());
    else bot(lang==='ko'
      ? '그 부분은 아직 정리해 두지 않았어요. 연구 · 강의 · 저서 · 언론 보도 · 문의 중에서 물어봐 주세요.'
      : 'I have not covered that yet. Try research, teaching, books, press, or contact.',
      {t:lang==='ko'?'문의하기':'Contact',u:'#contact'});
  },380);
}
function submit(){const x=q.value.trim();if(!x)return;me(x);q.value='';answer(x)}
send.onclick=submit;q.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

paint();
</script>
</body>
</html>
